architectury {
    platformSetupLoomIde()
    neoForge()
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // YACL - neoforge
    modImplementation "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-neoforge"

    // owo-lib - neoforge (official Wisp Forest maven, faster/more reliable than Modrinth)
    modImplementation "io.wispforest:owo-lib-neoforge:${rootProject.owo_neo_version}"

    // Spell Engine (optional compat)
    modCompileOnly "maven.modrinth:spell-engine:${rootProject.spell_engine_version}-neoforge"

    // Combat Roll (optional compat)
    modCompileOnly "maven.modrinth:combat-roll:2.0.4+1.21.1-neoforge"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        def cleanedProps = project.properties.collectEntries { k, v ->
            def s = v?.toString()
            [(k.toString()): (s?.contains('+') ? s.substring(0, s.indexOf('+')) : s)]
        }
        expand(cleanedProps)
    }
}
